name: ExpiryManager
options:
  bundleIdPrefix: com.xiaoqi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_CODE_COVERAGE: NO
    GCC_INSTRUMENT_PROGRAM_FLOW_ARCS: NO
targets:
  ExpiryManager:
    type: application
    platform: iOS
    sources:
      - Sources/ExpiryApp
      # ★ 2026-10-09 新增：主 App 与 Widget 扩展**共用**的源码
      #   （灵动岛的活动属性 / 按钮 Intent / 日期格式化）。
      #   同一个文件也编进下面的 ExpiryWidget 目标，靠编译宏区分实现。
      - Sources/Shared
      # ⚠️ 不要用 `type: folder`。folder 会生成「蓝色文件夹引用」，
      #    打包后字体落在 app 包内的 `Resources/` 子目录里（非标准位置），
      #    UIAppFonts 里写的裸文件名就找不到文件，字体静默失效。
      #    用默认的 group 类型 -> 每个字体作为独立资源 -> 落在包根。
      - path: Resources
        buildPhase: resources
    dependencies:
      # 硕方 SFPrintSDK.xcframework 是**静态** framework（二进制是 ar 归档），
      # 只能链接、不能嵌入（嵌入静态库会在真机启动时出问题）。
      # ★ 2026-10-08：从 Flutter 插件的 `plugins/expiry_native_ios/ios/` 移到了
      #   `swiftui/Vendor/` —— 工程已全面转 iOS 原生，不再保留 Flutter 那棵树，
      #   硕方 SDK 直接由 swiftui 工程自带，换台电脑 clone 下来就能编。
      - framework: Vendor/SFPrintSDK.xcframework
        embed: false
      # ★ 2026-10-09：灵动岛需要 WidgetKit 扩展，它必须作为
      #   `PlugIns/ExpiryWidget.appex` 嵌进 App 包，否则 `Activity.request()`
      #   找不到能渲染 Live Activity 的扩展。
      - target: ExpiryWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoqi.expiry_manager
        PRODUCT_NAME: ExpiryManager
        GENERATE_INFOPLIST_FILE: YES
        # ★ 2026-10-10（第十轮）主 App 也要一份自己的 Info.plist ——
        #   为了注册 `CFBundleURLTypes`（deep link scheme `expirymanager`，
        #   用户图5「点击灵动岛 → 进入效期管理」靠它才能把 URL 路由进来）。
        #   ⚠️ `INFOPLIST_KEY_*` 只支持平铺标量键，写不了嵌套数组，
        #     所以必须落到文件里。
        #   ⚠️ 与上面的 `GENERATE_INFOPLIST_FILE: YES` **并存**：
        #      Xcode 以本文件为底，再把所有 `INFOPLIST_KEY_*` 合并进来。
        #   ⚠️ 该文件里同时显式写了 `NSSupportsLiveActivities = YES`。
        INFOPLIST_FILE: Support/ExpiryManager-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ★ 2026-10-08：优化清单做完，正式投入使用，版本号从 1.6.15 重置为 1.0.0。
        #   ⚠️ `CURRENT_PROJECT_VERSION`（build）**必须只增不减** ——
        #      iOS 就地升级时如果 build 比在装的低，installd 会拒绝安装。
        # ★ 2026-10-09 第一轮：肉类模板 + 键盘/日期交互 + 提醒分级 + 灵动岛 → 1.0.1 / 27。
        # ★ 2026-10-09 第二轮（灵动岛排版 / 按钮按阶段 / 到点自动展开 / 稍后提醒
        #   重启 5 分钟倒计时）→ 1.0.2 / build 28。
        # ★ 2026-10-09 第三轮（日期统一 xxxx/xx/xx + 修「滚轮选完年月面板消失」
        #   + 日期单位改英文缩写）→ 1.0.3 / build 29。
        # ★ 2026-10-09 第四轮（日期选择恢复「点击后展开」/ 去掉「请选择」占位 /
        #   恢复滑动收键盘 / 通用奶制品扫码入库 / 灵动岛排版与紧凑态加粗）→ 1.0.4 / 30。
        # ★ 2026-10-09 第五轮（★ 本次，用户说「就剩这些问题了，这一次一定要改好」）：
        #   ① 灵动岛紧凑态彻底消缝：倒计时改 `showsHours: false` 走 `M:SS`
        #      （>1h 才回退 `H:MM:SS`），图标 `.imageScale(.small)`，
        #      不加任何 padding/frame；到点换警示三角 + 红色「到点」。
        #   ② 日期控件排版修复：**去掉 overlay 方案**（那会把标题挤没、日期顶到左侧），
        #      改成 HStack 主布局 —— 标题在左、日期在右，物理上不可能错位。
        #   → 1.0.5 / build 31。
        # ★ 2026-10-10 第六轮（用户说「就剩这些问题了」后仍有两条）：
        #   ① 日期行**重复排版**：`DatePicker(.compact)` 藏不掉自己的日期文字，
        #      与我自绘的 `xxxx/xx/xx` 同屏 → **删掉自绘 Text，只留系统那个**
        #      （用户明确说系统的 `xxxx年xx月xx日` 才是「可用于点击的正常功能」）。
        #   ② 灵动岛紧凑态**缝隙/黑边**：紧凑槽位是固定宽度，内容少时系统让它**居中**
        #      → 用 `.frame(maxWidth: .infinity, alignment: .trailing/.leading)`
        #      让内容**填满槽位并朝向摄像头**。
        #   ③ **到点无强化通知**：补回 tier 4 —— `timeSensitive` + 带按钮的
        #      「⚠️ xx已到，请立即处理」通知（之前误以为灵动岛会自动展开，故空着）。
        #   → 1.0.6 / build 32。
        # ★ 2026-10-10 第七轮（用户发 8 张截图逐条圈注）：
        #   ① **到点后灵动岛卡在 `0:00`**（图1/3/4）—— 这是本轮最重要的修复。
        #      根因：`Text(timerInterval:)` 归零后系统最后一次重绘时，旧代码
        #      仍走"有区间就渲染 timerInterval"的分支 → 永久卡 `0:00`。
        #      正解 = **双轨绘制**：判据统一为 `countdownInterval == nil`
        #      （非 nil → timerInterval；nil → 静态「到点/已到时间」），
        #      图标 / 数字 / 颜色 / 按钮**全部同源**，一次重绘里同时切换。
        #   ② 参照**苹果运动 App**（图2）：左侧图标改**纯白**（与标题同色），
        #      右侧倒计时改**苹果运动黄** `#FFD60A`（到点仍红）。
        #   ③ 展开态（图7）：左侧加 `.padding(.leading, 6)` 避免被胶囊圆角切；
        #      左上「沙漏+类别」颜色 `white.opacity(0.8)` → **纯白**。
        #   ④ 展开态（图7/图8）：右上大数字从「到期时刻」改成**真正的倒计时**
        #      （用户说「红色数字应为倒计时」），到期时刻降级为下方小字。
        #   ⑤ 展开态底部（图8）：改「**里程碑文案 + yyyy/MM/dd**」模板
        #      （如「最佳使用时间 2026/01/01」）—— 新增 `ExpiryDateFormat.date(_:)`。
        #   ⑥ 标题**不折行**（图8「保持完整一行」）：`lineLimit(1)` + 缩字。
        #   ⑦ `staleDate` 从 `dueAt` 延后到 `dueAt + graceWindow`（30 分钟）：
        #      避免到点那一刻整块卡片变灰，把最强提示压暗。
        #   → 1.0.7 / build 33。
        # ★ 2026-10-10 第八轮（用户再发 3 张截图）：
        #   ① **紧凑态「大片黑边」的真正元凶 = 第七轮加的
        #      `.frame(maxWidth: .infinity, alignment:)`** ——
        #      `.maxWidth: .infinity` 让内容主动贪占最大宽度，把整条灵动岛
        #      撑到上限。→ **直接删掉那两句**，让内容按固有尺寸布局。
        #      ⚠️ 系统默认内边距带来的那一点点「缝」**无法消除**（紧凑槽位
        #      有系统最小宽度），但远好过「整岛变宽 + 大片黑」。
        #   ② 展开态重排（图2）：类别放大到 `.subheadline` 半粗并与右侧
        #      倒计时**左右对称**；**标题搬到 `.bottom` 第一行**（`.headline`，
        #      放大）与里程碑行构成**相邻两排**；到期时刻 `HH:mm` 从右上角
        #      **移到日期之后**（「原始保质期 2026/10/10 13:37」）。
        #   ③ 左/右内边距 6 → **10**（图2「肉类最左边还是有点超出」）。
        #   → 1.0.8 / build 34。
        # ★ 2026-10-10 第九轮（用户仍问「为什么紧凑态这么宽，是不是和展开态有关」）：
        #   ① **查证结论：紧凑态尺寸是系统常量，App 改不了。**
        #      Apple 官方规范：compact leading / trailing 槽位各约
        #      52~62 × 36.67 pt，灵动岛总宽 = 摄像头 + 左槽 + 右槽；
        #      Expanded 宽度 371 pt（Pro）/ 408 pt（Pro Max）。
        #      「两端黑块」= **槽位固定宽度 − 内容实际宽度**，不是我们画的。
        #      紧凑态与展开态**互不影响**（两条独立渲染路径）。
        #   ② 唯一改善手段 = **放大内容**（用户也要求「左右图标文字适当放大」）：
        #      紧凑态图标 `.imageScale(.small)` → **`.title3`**；
        #      紧凑态倒计时 `.caption` → **`.title3`**。
        #   ③ 不要再试 `maxWidth: .infinity` / `contentMargins(...,0)` / `fixedSize()`
        #      —— 三者都改不了宽度，只会更糟（详见 `ExpiryLiveActivity.swift` 头注释）。
        #   → 1.0.9 / build 35。
        # ★ 2026-10-10 第十轮（用户发 6 张截图，说「问题一直没有得到修改，
        #   已经重复几遍了，相同的问题一直得不到解决」）—— 本轮**一次修 3 件事**：
        #   ① 【图6】肉类模板「选择完肉类后部位信息全不见了」：
        #      `onChange(of: animal)` 把 `cut = nil`，而「部位」Picker 没有
        #      tag 为 nil 的占位项 → SwiftUI 找不到匹配项，整个值区渲染成空白。
        #      → 改成**换肉类时自动选中该肉类第一个部位**。
        #   ② 【图5】点灵动岛 / 通知跳错页：工程里**从来没有**
        #      `widgetURL` / `onOpenURL` / 任何路由层，系统只能按默认行为把
        #      App 拉起来（= 停在用户上次退出的页面）。
        #      → 新增 `AppRouter`（路由信箱）+ `ExpiryDeepLink`（共享 URL 约定），
        #        注册 `expirymanager://` scheme（新增
        #        `Support/ExpiryManager-Info.plist` + `INFOPLIST_FILE`），
        #        接上 `onOpenURL` + 通知默认点击 + 锁定屏幕卡片 `widgetURL`。
        #   ③ 【图1/图2】到期后灵动岛只有紧凑态 + 本地通知，**不自动弹展开态**：
        #      根因是我们调的是 `activity.update(content)` —— **没带
        #      `alertConfiguration`**。Apple 文档原文：带 alertConfiguration 的更新
        #      「the system shows the expanded Live Activity in the Dynamic Island」。
        #      但 App 不在前台时根本调不到 update，所以真正解法是**预定式活动**：
        #        `Activity.request(…, style: .standard,
        #                          alertConfiguration: …, start: dueAt)`
        #      Apple 原文：「The system starts the Live Activity at the specified
        #      date, **even if the app is in the background**.」
        #      → 由系统在到点那一刻自动拉起并弹出展开态，**不需要 App 在运行**。
        #   → 1.0.10 / build 36。
        # ★ 2026-10-10 第十一轮（用户拿两张**同为紧凑态**的截图对比，指出
        #   「明明图二是做到了的，对比代码！」）：
        #   ① **重大更正**：前面几轮说的「紧凑态槽位是系统常量、改不了宽度」
        #      **只对了一半**。真正规律是：
        #      · 图1 = **倒计时**状态（`Text(timerInterval:)`）→ 岛**很宽**；
        #      · 图2 = **到点**状态（静态 `Text("到点")`）→ 岛**很窄**。
        #      同一个 App、同一套字体内边距，唯一差别就是「是不是系统 timer 文字」。
        #      ➜ 根因：`Text(timerInterval:)` 由系统托管，数字每秒变而宽度不能抖
        #        → 系统按**最长可能值预留**宽度且**不参与收缩** → 槽位被撑到上限。
        #        普通 `Text` 按自身尺寸布局 → 槽位收到最窄。
        #      ➜ 宽度**是可以控的**。
        #   ② 修法：给 `CompactCountdownText` 整个 Group **显式钉死宽度**
        #      （`slotWidth = 46`pt）+ `minimumScaleFactor` 0.7 → 0.5，
        #      把系统那层预留挡在外面，倒计时态也能收到最窄。
        #      ⚠️ 与 `.fixedSize()` 方向相反，别搞混（见 widget 文件头）。
        #   → 1.0.11 / build 37。
        # ★ 2026-10-10 第十二轮（用户三条）：
        #   ① 紧凑态倒计时格式 `H:MM:SS` → **`M:SS`**（用户指出「应该是 MM:SS」），
        #      并把钉死的槽位宽度 46 → **42**（对齐「到点」态的自然宽度 40pt）。
        #   ② **点灵动岛胶囊不跳页** —— 真正原因找到了：`.widgetURL` 上一轮只加在
        #      `ActivityConfiguration` 的**锁定屏幕视图**上，**没加到 `DynamicIsland`**；
        #      灵动岛是另一条渲染路径，拿不到那个 URL。
        #      Apple 文档里 `DynamicIsland` **自己就带一个 `widgetURL(_:)`**
        #      （「设置用户轻点实时活动时打开对应 App 的 URL」）→ 本轮补上。
        #   ③ **有灵动岛胶囊时不弹通知横幅**：命中岛上的那条里程碑，其
        #      「提前 1 小时 / 提前 10 分钟 / 到点」三档通知改为
        #      `interruptionLevel = .passive` —— 只进通知中心与锁屏，不弹横幅。
        #      判据抽成 `ExpiryActivityManager.nearestMilestone`（nonisolated
        #      纯函数），与 `sync` 共用同一套规则。
        #   → 1.0.13 / build 39。
        # ★★ 2026-10-10（第十三轮）：用户「两个灵动岛同时存在、要关掉横幅才切换」。
        #   · **给两条活动设 `relevanceScore`**（A 倒计时 = 50、B 到点警报 = 100）
        #     —— Apple 规则：分高者显示在灵动岛；都不给分/同分则显示**先启动**的。
        #     这正是「灵动岛一直显示 0:00 那条」的根因。
        #   · **到点后 A 退场**（`sync` 判定「已过点 + B 已开响」时收掉 A），
        #     让灵动岛与锁屏只剩「已到时间」那一张 —— 即用户要的
        #     「下方代替上方 / 同一个模块的不同形态」。
        #   · `restart`（稍后提醒）在 A 已被收掉时用落盘属性重建 A。
        #   ⚠️ 提醒（通知）的 4 档时机与 passive 静默判据**一律未动**。
        # ★★★ 2026-10-10（第十四轮）：全工程梳理优化（用户：「功能不变，
        #   优化全部工程」+「锁屏还是两张卡，去查资料做无缝衔接」）。
        #   ① **无缝衔接根因修复**：A 的 `staleDate` 从 `dueAt + graceWindow`
        #      改回 `dueAt` —— staleDate 是系统重绘这条活动的触发器
        #      （App 被杀也触发），重绘时 `countdownInterval` 翻 nil，
        #      双轨分支从 `Text(timerInterval:)` 翻成静态「已到时间」。
        #      第七轮把触发器推迟 30 分钟 = 分支加了却永远不执行，
        #      这就是第七~十三轮锁屏卡 `0:00` 的顽疾根因。
        #      B（到点警报）的 staleDate 维持 `dueAt + graceWindow` 不变。
        #   ② 清理死代码（净 −415 行）：PreviewView/PreviewPayload/ShareSheet
        #     （预览功能 10-07 已取消，零入口）、`Phase`/`phase`（零读者）、
        #      `CountdownText`、`canReprint`、`stopMonitoring`、Prefs 两个死键。
        #   ③ 收敛重复：`orFallback`（杀 4 处 `message!`）、`MakerField`
        #     （5+1 个模板页共用）、`buildOpenedLabel`（通用/奶制品/肉类同版式）、
        #      `makerFooter`、`LabelReprint.printNoticing`（列表/详情两入口）。
        #   ④ 修正过期注释与用户可见文案（使用流程第 3 步、提醒页脚补第 5 档）。
        #   ⚠️ 功能与提醒逻辑一律未变；所有 builder 公开签名保持不变（单测不动）。
        # ★ 2026-10-10（第十五轮）：用户验收后两问拍板 ——
        #   ① 锁屏两张卡：**保持现状**（平台无「定时结束活动」API，
        #     A 无法定时自杀；1.0.14 起 A 到点翻「已到时间」变灰 = 视觉衔接）。
        #   ② 「倒计时归零 → B 弹出」有 1~2 秒系统调度延迟 →
        #     **B 的预定时刻提前 3 秒**（`alertFireLead`，施加在
        #     `scheduleAlertForNextMilestone` 的 target 上，
        #     `scheduledAlertDueKey` 与真实启动时刻对齐）。
        #   用户预案：这版有问题就回退 1.0.14。
        # ★ 2026-10-10（第十六轮，v1.1.0）：用户验收 1.0.15 通过、正式投入使用；
        #   唯一改动 = **解冻模板第二行**「原始保质期」→「完成时间」
        #   （值 = 解冻时间 + 1 天，`MeatRule.thawCompleteDays/thawedComplete`）。
        #   连带：`buildMeatThaw` 去掉 `expireRaw` 参数、`rebuild` 解冻分支
        #   按 `createdAt` 重算完成时间、`parseMeatQr` 正则同时兼容
        #   「原始保质期 / 完成时间」两种锚点（存量旧标签仍可扫）。
        #   ⚠️ 标签其余各行、二维码格式与**全部提醒逻辑一律未变**。
        CURRENT_PROJECT_VERSION: 42
        MARKETING_VERSION: 1.1.0
        # ★ 主 App 目标带这个宏；Widget 扩展带 EXPIRY_WIDGET。
        #   `Sources/Shared` 里的 `ExpiryActivityBridge` 靠它区分
        #   「真实现（能访问 ExpiryStore）」和「空实现（只是让扩展编译过）」。
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EXPIRY_APP"
        # 硕方 SDK 是 ObjC 且没有 modulemap，Swift 只能通过桥接头访问
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ExpiryApp/Native/ExpiryApp-Bridging-Header.h
        # ★ 必须 -ObjC：静态库里只被 ObjC 类/分类引用的符号否则会被链接器剥掉，
        #   表现是「编译通过、真机 unrecognized selector」。
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        INFOPLIST_KEY_CFBundleDisplayName: 效期管理系统
        INFOPLIST_KEY_CFBundleSignature: "????"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 用于连接蓝牙标签打印机，打印效期标签。
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: 用于连接蓝牙标签打印机，打印效期标签。
        INFOPLIST_KEY_NSCameraUsageDescription: 用于扫描标签上的二维码，识别物料信息。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于读取图片以生成标签。
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES

  # ---------------------------------------------------------------- 灵动岛扩展
  # ★ 2026-10-09 新增。Live Activity 的 UI **只能**由 WidgetKit 扩展渲染，
  #   宿主 App 里没法内联（ActivityKit 的结构要求）。
  #
  # ⚠️ 它不需要 App Group —— 扩展渲染用的全部内容都由 `ContentState` 带过来，
  #    按钮回写走 `LiveActivityIntent`（在主 App 进程执行，能直接访问
  #    `ExpiryStore`）。少一个临场创建的 `4U3G6835M9.xxx`，
  #    就少一份「装机时多出第二个 App」的风险。
  ExpiryWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/ExpiryWidget
      - Sources/Shared
      # 只借用品牌色常量（Theme.swift 没有任何主 App 依赖）。
      # ⚠️ 往 Theme.swift 里加东西前先看它会不会引进 App 专属类型，
      #    否则会连带把这个扩展编崩。
      #
      # ★ 2026-10-09：这里**只显式列出 Theme.swift 一个文件**，不整目录引用
      #   `Sources/ExpiryApp`。`Views/DatePickerDismissal.swift` 用了
      #   `UIApplication.shared`，是主 App 专属代码 —— 只要不整目录扫进来，
      #   扩展就永远编不到它，无需 `excludes`（那反而容易把整棵树顶掉）。
      - Sources/ExpiryApp/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoqi.expiry_manager.widget
        PRODUCT_NAME: ExpiryWidget
        SKIP_INSTALL: YES
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 42
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EXPIRY_WIDGET"
        # ⚠️ Info.plist 放在 `Support/` 而不是 source 目录里 ——
        #    否则 xcodegen 可能把它当成资源再打一份进包里。
        INFOPLIST_FILE: Support/ExpiryWidget-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  ExpiryManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ExpiryAppTests
    dependencies:
      - target: ExpiryManager

# ★ 显式声明 scheme 并挂上 test action。
#   xcodegen 生成的 scheme 不一定带测试动作，`xcodebuild test` 会直接报
#   「scheme is not currently configured for the test action」。
schemes:
  ExpiryManager:
    build:
      targets:
        ExpiryManager: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ExpiryManagerTests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
