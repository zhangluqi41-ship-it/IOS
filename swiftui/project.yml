name: ExpiryManager
options:
  bundleIdPrefix: com.xiaoqi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  ExpiryManager:
    type: application
    platform: iOS
    sources:
      - path: Sources/ExpiryApp
        excludes:
          - Info.plist
      - path: Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoqi.expiry_manager
        PRODUCT_NAME: ExpiryManager
        INFOPLIST_FILE: Sources/ExpiryApp/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
  ExpiryManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ExpiryAppTests
    dependencies:
      - target: ExpiryManager
schemes:
  ExpiryManager:
    build:
      targets:
        ExpiryManager: all
    test:
      targets:
        - ExpiryManagerTests
