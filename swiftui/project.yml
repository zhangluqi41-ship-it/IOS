        #      两个按钮 `.controlSize(.large)` + 都外层等宽（比例对齐）、
        #      预览区去掉 ScrollView 与写死高度（消除大片空白）。
        # ★ 2026-10-18 第十一轮（用户 2 条）：
        #   ① 修拖动 bug（长按消失/点不动）：`onDrag` 一长按就置 dragging，松手在空白处
        #      无回调 -> 永久透明。现在**普通模式只挂 contextMenu**（长按弹菜单，不动状态），
        #      菜单里选「移动排序」才挂 onDrag；另加网格层 onDrop 兜底清状态。
        #   ② 确认窗按**系统 alert 的套件**重做（宽 300 / 圆角 14 / 标题居中 /
        #      通栏分隔线 / 两按钮并排各半 + 竖线分隔 / 纯文字蓝 / `.regularMaterial`）。
        # ★ 2026-10-18 第十二轮（用户 bug）：固定/取消固定后界面不立即刷新。
        #   根因：`isPinned` 直读 `Prefs.pinnedTemplates`（UserDefaults）——不是响应式状态；
        #   顺序没变时（固定的本来就在第一位）不触发重绘。改用 `@State pinnedKeys/hiddenKeys` 镜像。
        # ★ 2026-10-19（用户逐条过 bug，一次发包）：
        #   ① 浅色模式磁贴不可见 → GroupBox 垫系统语义色；
        #   ② 右上角按钮 = 固定快捷键（去掉长按菜单）；
        #   ③ 拖动改系统拖放（轻量 preview 解决跟手）+ 松手不消失 + 源 35% 可见；
        #   ④ 松手动画：被拖的瞬移落位，其余滑动；
        #   ⑤ 确认打印 = **真系统 alert**（`.alert`，删掉自绘卡片）；
        #   ⑥ 摘要：多固定 / 二级页可操作（滑动用完/详情/重打）；
        #   ⑦ 摘要逻辑：正在制作中 = 有完成时间且未到；新增「已完成制作」；
        #   ⑧ 扫码框 = 四角 L 形 + 呼吸（1.7s / 1.05 倍）。
        # ★ 2026-10-19 第二批（用户逐条）：
        #   ① 磁贴改回"自己画卡片"（GroupBox 浅色下不可见，实测）；
        #   ② 磁贴圆角 22（与「密码」App 一致）；
        #   ③ 拖动改 DragGesture（整张磁贴跟手，不带缩略图）；
        #   ④ 滑动菜单：只有图标、顺序 删除→用完、删除红色（摘要 + 效期管理同步）；
        #   ⑤ 扫码框四角改圆弧（r=13）+ 呼吸；
        #   ⑥ 打印确认改 UIKit `UIAlertController` + `addTextField`（能输入份数）
        #      + `inputAccessoryView` 里的 `UIStepper`（键盘上方加减）。
        # ★ 2026-10-19 第三批：
        #   ① 滑动按钮顺序 左删除(红)/右用完 + 纯图标；
        #   ② 打印弹窗加「打印份数（1~20）」提示 + 字号 15；
        #   ③ 固定按钮圆形外框 + 对比色 + 整圆热区（28pt）；
        #   ④ 拖动手势改 highPriorityGesture（被 NavigationLink 抢）；
        #   ⑤ 松手落位改 easeOut(0.22) 自然过渡；
        #   ⑥ 扫码框按**硬件屏幕 R 角**比例（250pt 框 → 半径 35，角长 52）。
        # ★ 2026-10-19 第四批：用完动画(系统默认) / 固定按钮去描边 /
        #   拖动视觉(被拖的半透明+放大1.06, 目标不变淡) + 全默认动画 /
        #   扫码框 215pt+线宽6+弧38+呼吸1.10/1.1s
        # ★ 2026-10-19 第五批：用完动画走乐观删除路径 / 呼吸 0.65s / 按下即放大 /
        #   拖动掉帧修复(tileFrames 值类型循环 -> class) / 松手后图层保持在上
        # ★ 2026-10-19 第六批：摘要路径常重置 / 滑动顺序修正 / 无键盘份数 /
        #   删到期提醒开关 / 网格置顶与掉帧优化 / 按下即放大 / 呼吸0.65
        # ★ 2026-10-19 第七批：自定义模板全套（并入 TemplateRoute.custom）+ 长按菜单 + 删除模式
        # ★ 2026-10-19 第八批：滑动顺序/用完不再隐藏/扫码不关相机+单广角/
        #   自定义模板单页+下拉菜单/编辑器一屏树形/天数单层+继承
        CURRENT_PROJECT_VERSION: 92
        MARKETING_VERSION: 1.1.50
        # ★ 主 App 目标带这个宏；Widget 扩展带 EXPIRY_WIDGET。
        #   `Sources/Shared` 里的 `ExpiryActivityBridge` 靠它区分
        #   「真实现（能访问 ExpiryStore）」和「空实现（只是让扩展编译过）」。
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EXPIRY_APP"
        # 硕方 SDK 是 ObjC 且没有 modulemap，Swift 只能通过桥接头访问
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ExpiryApp/Native/ExpiryApp-Bridging-Header.h
        # ★ 必须 -ObjC：静态库里只被 ObjC 类/分类引用的符号否则会被链接器剥掉，
        #   表现是「编译通过、真机 unrecognized selector」。
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        INFOPLIST_KEY_CFBundleDisplayName: 效期管理系统
        INFOPLIST_KEY_CFBundleSignature: "????"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 用于连接蓝牙标签打印机，打印效期标签。
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: 用于连接蓝牙标签打印机，打印效期标签。
        INFOPLIST_KEY_NSCameraUsageDescription: 用于扫描标签上的二维码，识别物料信息。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于读取图片以生成标签。
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES

  # ---------------------------------------------------------------- 灵动岛扩展
  # ★ 2026-10-09 新增。Live Activity 的 UI **只能**由 WidgetKit 扩展渲染，
  #   宿主 App 里没法内联（ActivityKit 的结构要求）。
  #
  # ⚠️ 它不需要 App Group —— 扩展渲染用的全部内容都由 `ContentState` 带过来，
  #    按钮回写走 `LiveActivityIntent`（在主 App 进程执行，能直接访问
  #    `ExpiryStore`）。少一个临场创建的 `4U3G6835M9.xxx`，
  #    就少一份「装机时多出第二个 App」的风险。
  ExpiryWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/ExpiryWidget
      - Sources/Shared
      # 只借用品牌色常量（Theme.swift 没有任何主 App 依赖）。
      # ⚠️ 往 Theme.swift 里加东西前先看它会不会引进 App 专属类型，
      #    否则会连带把这个扩展编崩。
      #
      # ★ 2026-10-09：这里**只显式列出 Theme.swift 一个文件**，不整目录引用
      #   `Sources/ExpiryApp`。主 App 的 Views 里有大量 `UIApplication.shared` /
      #   UIKit 手势代码（如 `KeyboardDismiss.swift`、已删除的
      #   `DatePickerDismissal.swift`）—— 只要不整目录扫进来，扩展就永远编不到
      #   它们，无需 `excludes`（那反而容易把整棵树顶掉）。
      - Sources/ExpiryApp/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoqi.expiry_manager.widget
        PRODUCT_NAME: ExpiryWidget
        SKIP_INSTALL: YES
        MARKETING_VERSION: 1.1.50
        CURRENT_PROJECT_VERSION: 92
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EXPIRY_WIDGET"
        # ⚠️ Info.plist 放在 `Support/` 而不是 source 目录里 ——
        #    否则 xcodegen 可能把它当成资源再打一份进包里。
        INFOPLIST_FILE: Support/ExpiryWidget-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  ExpiryManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ExpiryAppTests
    dependencies:
      - target: ExpiryManager

# ★ 显式声明 scheme 并挂上 test action。
#   xcodegen 生成的 scheme 不一定带测试动作，`xcodebuild test` 会直接报
#   「scheme is not currently configured for the test action」。
schemes:
  ExpiryManager:
    build:
      targets:
        ExpiryManager: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ExpiryManagerTests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
