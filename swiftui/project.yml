name: ExpiryManager
options:
  bundleIdPrefix: com.xiaoqi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_CODE_COVERAGE: NO
    GCC_INSTRUMENT_PROGRAM_FLOW_ARCS: NO
targets:
  ExpiryManager:
    type: application
    platform: iOS
    sources:
      - Sources/ExpiryApp
      # ⚠️ 不要用 `type: folder`。folder 会生成「蓝色文件夹引用」，
      #    打包后字体落在 app 包内的 `Resources/` 子目录里（非标准位置），
      #    UIAppFonts 里写的裸文件名就找不到文件，字体静默失效。
      #    用默认的 group 类型 -> 每个字体作为独立资源 -> 落在包根。
      - path: Resources
        buildPhase: resources
    dependencies:
      # 硕方 SFPrintSDK.xcframework 是**静态** framework（二进制是 ar 归档），
      # 只能链接、不能嵌入（嵌入静态库会在真机启动时出问题）。
      # ★ 2026-10-08：从 Flutter 插件的 `plugins/expiry_native_ios/ios/` 移到了
      #   `swiftui/Vendor/` —— 工程已全面转 iOS 原生，不再保留 Flutter 那棵树，
      #   硕方 SDK 直接由 swiftui 工程自带，换台电脑 clone 下来就能编。
      - framework: Vendor/SFPrintSDK.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoqi.expiry_manager
        PRODUCT_NAME: ExpiryManager
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ★ 2026-10-08：优化清单做完，正式投入使用，版本号从 1.6.15 重置为 1.0.0。
        #   ⚠️ `CURRENT_PROJECT_VERSION`（build）**必须只增不减** ——
        #      iOS 就地升级时如果 build 比在装的低，installd 会拒绝安装。
        #      上一版是 25，所以这里从 26 继续走。
        CURRENT_PROJECT_VERSION: 26
        MARKETING_VERSION: 1.0.0
        # 硕方 SDK 是 ObjC 且没有 modulemap，Swift 只能通过桥接头访问
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ExpiryApp/Native/ExpiryApp-Bridging-Header.h
        # ★ 必须 -ObjC：静态库里只被 ObjC 类/分类引用的符号否则会被链接器剥掉，
        #   表现是「编译通过、真机 unrecognized selector」。
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        INFOPLIST_KEY_CFBundleDisplayName: 效期管理系统
        INFOPLIST_KEY_CFBundleSignature: "????"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 用于连接蓝牙标签打印机，打印效期标签。
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: 用于连接蓝牙标签打印机，打印效期标签。
        INFOPLIST_KEY_NSCameraUsageDescription: 用于扫描标签上的二维码，识别物料信息。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于读取图片以生成标签。
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  ExpiryManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ExpiryAppTests
    dependencies:
      - target: ExpiryManager

# ★ 显式声明 scheme 并挂上 test action。
#   xcodegen 生成的 scheme 不一定带测试动作，`xcodebuild test` 会直接报
#   「scheme is not currently configured for the test action」。
schemes:
  ExpiryManager:
    build:
      targets:
        ExpiryManager: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ExpiryManagerTests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
