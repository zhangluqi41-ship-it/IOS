name: Build iOS (SwiftUI)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: swiftui
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Debug build settings
        working-directory: swiftui
        run: |
          xcodebuild -project ExpiryManager.xcodeproj -scheme ExpiryManager -showBuildSettings 2>/dev/null | grep -iE "GENERATE_INFOPLIST|PRODUCT_BUNDLE_IDENTIFIER|INFOPLIST_FILE"

      - name: Debug build simulator and inspect Info.plist
        working-directory: swiftui
        run: |
          xcodebuild build -project ExpiryManager.xcodeproj -scheme ExpiryManager -sdk iphonesimulator -derivedDataPath dbg CODE_SIGNING_ALLOWED=NO 2>&1 | tail -3
          APP=$(find dbg/Build/Products -name "ExpiryManager.app" -type d | head -1)
          echo "APP=$APP"
          plutil -p "$APP/Info.plist" | head -30

      - name: Run unit tests
        working-directory: swiftui
        run: |
          xcodebuild test \
            -project ExpiryManager.xcodeproj \
            -scheme ExpiryManager \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS (release, no codesign)
        working-directory: swiftui
        run: |
          xcodebuild build \
            -project ExpiryManager.xcodeproj \
            -scheme ExpiryManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        working-directory: swiftui
        run: |
          APP=build/Build/Products/Release-iphoneos/ExpiryManager.app
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry ExpiryManager-unsigned.ipa Payload
          ls -la ExpiryManager-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpiryManager-unsigned-ipa
          path: swiftui/ExpiryManager-unsigned.ipa
          retention-days: 14
