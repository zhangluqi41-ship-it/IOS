name: Build iOS (SwiftUI)

on:
  push:
    branches: [main]
  workflow_dispatch:

# ★ 构建失败时要把 .ci-error.log 推回仓库，必须给写权限
#   （否则 GITHUB_TOKEN 默认只读，push 会被拒）。
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- 单元测试
  # ★ 独立成一个 job 并且**不加 continue-on-error**：
  #   测试失败时整个 workflow 变红（能第一时间发现回归），
  #   但下面的 build job 照常出包 —— 不会因为测试挂了就没 IPA 可用。
  test:
    name: Unit tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: swiftui
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available \
            | grep -m1 -E "^[[:space:]]+iPhone" \
            | sed -E 's/^[[:space:]]+//; s/ \(.*//')
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "选定模拟器：$DEVICE"
          xcrun simctl list runtimes

      - name: Run unit tests
        working-directory: swiftui
        run: |
          xcodebuild test \
            -project ExpiryManager.xcodeproj \
            -scheme ExpiryManager \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

  # ---------------------------------------------------------------- 出包
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: swiftui
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build iOS (release, no codesign)
        working-directory: swiftui
        run: |
          set -o pipefail
          xcodebuild build \
            -project ExpiryManager.xcodeproj \
            -scheme ExpiryManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee /tmp/build.log
          status=$?

          # ★ 把编译错误写进 Job Summary —— 这样在没有 actions:read 权限的情况下，
          #   打开 Actions 页面就能直接看到「哪个文件第几行报了什么错」。
          if [ "$status" -ne 0 ]; then
            # ① 把错误行落成仓库里的文件 —— 这是唯一「无需任何额外权限就能读到」的通道：
            #    构建失败时把自己 push 回去，本地 git pull 即可看到真实的文件:行:错误。
            {
              echo "# 构建失败（$(date -u '+%Y-%m-%d %H:%M:%SZ')）"
              echo "exit=$status"
              echo
              grep -E "error: " /tmp/build.log | sed 's|.*/Sources/|Sources/|' | sort -u | head -120
              echo
              echo "---- 原始尾部 ----"
              tail -60 /tmp/build.log
            } > "$GITHUB_WORKSPACE/.ci-error.log" 2>/dev/null || true

            echo "## 编译失败（exit $status）" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -80 "$GITHUB_WORKSPACE/.ci-error.log" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 编译成功" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$GITHUB_WORKSPACE/.ci-error.log"
          fi

          exit "$status"

      # ★ 失败时把错误日志提交回仓库（[skip ci] 避免递归触发）。
      - name: Publish error log
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -s .ci-error.log ]; then echo "无错误日志"; exit 0; fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci-error.log
          git commit -m "ci: build error log [skip ci]" || exit 0
          git push origin HEAD:main || echo "push 失败（可能无写权限）"

      - name: Patch Info.plist (scene manifest + 本地化 + 字体 + 缺失键)
        working-directory: swiftui
        run: |
          # ★ iOS 27 起强制要求 scene-based 生命周期；xcodegen 不会自动生成该键，
          #   且 INFOPLIST_KEY_* 里不认识的键会被静默丢弃 -> 必须直接改写 Info.plist。
          APP=build/Build/Products/Release-iphoneos/ExpiryManager.app
          PL="$APP/Info.plist"
          PB=/usr/libexec/PlistBuddy

          $PB -c "Delete :UIApplicationSceneManifest" "$PL" 2>/dev/null || true
          $PB -c "Add :UIApplicationSceneManifest dict" "$PL"
          $PB -c "Add :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes bool false" "$PL"

          $PB -c "Delete :CFBundleSignature" "$PL" 2>/dev/null || true
          $PB -c "Add :CFBundleSignature string ????" "$PL"

          $PB -c "Delete :UIFileSharingEnabled" "$PL" 2>/dev/null || true
          $PB -c "Add :UIFileSharingEnabled bool true" "$PL"

          $PB -c "Delete :LSSupportsOpeningDocumentsInPlace" "$PL" 2>/dev/null || true
          $PB -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PL"

          # ★ 2026-10-09：灵动岛（Live Activity）。
          #   `NSSupportsLiveActivities` 不是 `INFOPLIST_KEY_*` 认识的键，
          #   写在 project.yml 里会被静默丢掉 —— 只能在这里补。
          #   缺了它的症状：`Activity.request()` 直接抛
          #   `ActivityAuthorizationError`，灵动岛永远不出现。
          $PB -c "Delete :NSSupportsLiveActivities" "$PL" 2>/dev/null || true
          $PB -c "Add :NSSupportsLiveActivities bool true" "$PL"

          # ★ 确认 Widget 扩展真的被嵌进来了（少一个就说明 embedding 没生效）。
          echo "=== PlugIns ==="
          ls -la "$APP/PlugIns" 2>/dev/null || echo "!! 没有 PlugIns 目录，扩展没嵌进来"

          # ★ 本地化：开发区设成 zh_CN 并显式声明支持简体中文。
          #   不声明的话 App 的「首选语言」是 en，日期选择器会显示英文月份 / 星期。
          $PB -c "Delete :CFBundleDevelopmentRegion" "$PL" 2>/dev/null || true
          $PB -c "Add :CFBundleDevelopmentRegion string zh_CN" "$PL"
          $PB -c "Delete :CFBundleLocalizations" "$PL" 2>/dev/null || true
          $PB -c "Add :CFBundleLocalizations array" "$PL"
          $PB -c "Add :CFBundleLocalizations:0 string zh-Hans" "$PL"
          $PB -c "Add :CFBundleLocalizations:1 string en" "$PL"

          # ★ 字体注册：INFOPLIST_KEY_UIAppFonts 不是受支持的 key，会被丢弃，
          #   所以这里手工把包内的字体登记进 UIAppFonts（用相对包根的路径），
          #   否则 FontProvider 只会回落到系统字体，而标签行距是按 Noto Sans SC 调的。
          echo "=== 包内字体 ==="
          find "$APP" -maxdepth 2 \( -name '*.ttf' -o -name '*.otf' \) -print || true
          $PB -c "Delete :UIAppFonts" "$PL" 2>/dev/null || true
          FONTS=$(cd "$APP" && find . -maxdepth 2 \( -name '*.ttf' -o -name '*.otf' \) | sed 's|^\./||')
          if [ -n "$FONTS" ]; then
            $PB -c "Add :UIAppFonts array" "$PL"
            i=0
            for f in $FONTS; do
              $PB -c "Add :UIAppFonts:$i string $f" "$PL"
              i=$((i+1))
            done
          else
            echo "!! 警告：包内没有找到字体文件，UIAppFonts 未写入"
          fi

          echo "=== Info.plist after patch ==="
          plutil -p "$PL"

      - name: Package unsigned IPA
        working-directory: swiftui
        run: |
          APP=build/Build/Products/Release-iphoneos/ExpiryManager.app
          rm -rf Payload ExpiryManager-unsigned.ipa
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry ExpiryManager-unsigned.ipa Payload
          ls -la ExpiryManager-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpiryManager-unsigned-ipa
          path: swiftui/ExpiryManager-unsigned.ipa
          retention-days: 14
