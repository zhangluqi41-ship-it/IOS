name: expiry_manager
description: "效期管理程序 —— 生成 50x30mm 效期标签 PDF"
publish_to: 'none'
version: 1.6.1+10

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdf: ^3.13.1
  printing: ^5.15.1
  qr: ^3.0.2
  mobile_scanner: ^7.4.2

  # iOS 26 原生 Liquid Glass 组件（走 UiKitView，iOS 26+ 上是苹果原厂材质）。
  # 包要求 iOS >= 15.0，与本工程部署目标一致；低版本自动回落 Flutter 实现。
  # 注意：原生组件是嵌进 Flutter 的原生视图，**不要放进滚动长列表**
  #（列表行、输入框、日期选择器仍用 Cupertino 自绘）。
  cupertino_native_better: ^1.6.0

  # iOS 原生通道（蓝牙打印 / 设置持久化 / PDF 保存）。
  # 只在 iOS 生效：安卓侧的这三个 MethodChannel 由 android/ 里的 Kotlin 实现提供。
  expiry_native_ios:
    path: plugins/expiry_native_ios

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 标签 PDF 渲染与 App UI 统一使用开源思源黑体（Noto Sans SC），
  # 避免打包微软雅黑带来的授权问题。
  assets:
    - assets/fonts/

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
